<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semáforo del salón · Pizarra Viva</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1713; --card:#18241f; --line:#2b3a33; --text:#f3f4f1; --muted:#9fb0a7; --accent:#f5c542;
          --rojo:#ef4444; --amarillo:#f5c542; --verde:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:flex-end; padding:22px 28px 10px; gap:16px; flex-wrap:wrap; }
  h1 { margin:0; font-size:26px; } h1 span { color:var(--accent); }
  .muted { color:var(--muted); }
  .tools button { font:inherit; font-weight:600; background:transparent; color:var(--muted); border:1px solid var(--line);
                  border-radius:10px; padding:8px 12px; cursor:pointer; margin-left:6px; }
  .lights { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; padding:10px 28px; }
  .light { background:var(--card); border-radius:16px; padding:16px 20px; display:flex; align-items:center; gap:14px; }
  .light .bulb { width:22px; height:22px; border-radius:50%; }
  .light b { font-size:38px; font-weight:800; }
  .proj { padding:4px 28px 0; font-size:15px; }
  .groups { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px; padding:16px 28px 28px; }
  .group { background:var(--card); border-radius:16px; padding:16px; }
  .group h3 { margin:0 0 4px; font-size:15px; }
  .group .count { font-size:13px; color:var(--muted); margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:7px 12px; border-radius:999px; font-weight:600; font-size:14px; cursor:pointer; color:#0b0f0d;
          transition:transform .2s, background .4s; }
  .chip:hover { transform:scale(1.06); }
  .chip.live { outline:2px solid #fff; }
  .chip .ov { font-size:11px; }
  #panel { position:fixed; right:0; top:0; bottom:0; width:min(380px, 100vw); background:#1d2b25; padding:22px;
           box-shadow:-10px 0 30px rgba(0,0,0,.4); transform:translateX(105%); transition:transform .25s; overflow:auto; }
  #panel.open { transform:none; }
  #panel h2 { margin:0 0 6px; }
  #panel select, #panel button { font:inherit; width:100%; padding:10px; border-radius:10px; margin-top:8px; }
  #panel select { background:#0f1814; color:var(--text); border:1px solid var(--line); }
  #panel button { border:0; font-weight:700; background:var(--accent); cursor:pointer; }
  table { width:100%; border-collapse:collapse; margin:10px 0; font-size:14px; }
  td { padding:6px 4px; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Semáforo del <span>salón</span></h1>
    <div class="muted">1ro básico B · Matemática · Suma de fracciones con distinto denominador</div>
  </div>
  <div class="tools">
    <button id="seed">+ Salón demo</button>
    <button id="reset">Reiniciar</button>
  </div>
</header>

<section class="lights">
  <div class="light"><div class="bulb" style="background:var(--rojo)"></div><div><b id="c-rojo">0</b><div class="muted">necesitan clase</div></div></div>
  <div class="light"><div class="bulb" style="background:var(--amarillo)"></div><div><b id="c-amarillo">0</b><div class="muted">en proceso</div></div></div>
  <div class="light"><div class="bulb" style="background:var(--verde)"></div><div><b id="c-verde">0</b><div class="muted">dominan el tema</div></div></div>
</section>
<div class="proj muted" id="proj"></div>
<section class="groups" id="groups"></section>

<aside id="panel"></aside>

<script>
const $ = id => document.getElementById(id);
const COLOR = { rojo:'var(--rojo)', amarillo:'var(--amarillo)', verde:'var(--verde)' };
const RES = { CORRECTO:'✅ Correcto', SUMA_DIRECTA:'❌ Suma directa', NUMERADOR_SIN_AJUSTAR:'❌ No ajusta numerador', MULTIPLICA:'❌ Multiplica', OTRO:'❌ Otro' };
let STATE = null, openName = null;

async function api(path, body) {
  const r = await fetch('/api' + path, body !== undefined ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {});
  return r.json();
}

async function refresh() {
  STATE = await api('/class');
  for (const c of ['rojo', 'amarillo', 'verde']) $('c-' + c).textContent = STATE.counts[c];
  const T = STATE.total || 0;
  $('proj').textContent = T ? `Dominan ${STATE.counts.verde} de ${T} alumnos (${Math.round(100 * STATE.counts.verde / T)} %).` : 'Esperando respuestas de los alumnos…';

  const byName = Object.fromEntries(STATE.students.map(s => [s.name, s]));
  const order = ['SUMA_DIRECTA', 'NUMERADOR_SIN_AJUSTAR', 'MULTIPLICA', 'OTRO', 'CORRECTO'];
  $('groups').innerHTML = order.filter(k => STATE.groups[k]?.length).map(k => {
    const names = STATE.groups[k];
    const title = k === 'CORRECTO' ? 'Sin errores' : STATE.labels[k];
    return `<div class="group"><h3>${title}</h3><div class="count">${names.length} alumno${names.length > 1 ? 's' : ''}</div>
      <div class="chips">${names.map(n => {
        const s = byName[n];
        return `<span class="chip ${s.demo ? '' : 'live'}" style="background:${COLOR[s.status]}" onclick="openStudent('${n.replace(/'/g, "\\'")}')">
          ${n}${s.teacher_override ? ' <span class="ov">✎</span>' : ''}</span>`;
      }).join('')}</div></div>`;
  }).join('');
  if (openName) renderPanel();
}

function openStudent(name) { openName = name; renderPanel(); $('panel').classList.add('open'); }
window.openStudent = openStudent;

function renderPanel() {
  const s = STATE.students.find(x => x.name === openName); if (!s) return;
  const steps = ['diagnostico', 'clase', 'practica', 'reto'].map(k => (s.steps[k] ? '✓ ' : '○ ') + k).join(' · ');
  const answers = Object.entries(s.results || {}).map(([id, r]) => `<tr><td>${id}</td><td>${s.answers[id] || '—'}</td><td>${RES[r] || r}</td></tr>`).join('');
  $('panel').innerHTML = `
    <div style="text-align:right"><a href="#" onclick="closePanel();return false" style="color:var(--muted)">cerrar ✕</a></div>
    <h2>${s.name}</h2>
    <div class="muted">Estado: <b style="color:${COLOR[s.status]}">${s.status}</b> · ${'⭐'.repeat(s.stars || 0)}</div>
    <p class="muted">${steps}</p>
    ${answers ? `<table>${answers}</table>` : '<p class="muted">(alumno simulado)</p>'}
    <p><b>La IA detectó:</b><br>${s.ai_error ? STATE.labels[s.ai_error] : 'Sin errores'}</p>
    <label class="muted">¿Estás de acuerdo? Corrige si hace falta:</label>
    <select id="ov">
      <option value="">Sin errores</option>
      ${Object.entries(STATE.labels).map(([k, v]) => `<option value="${k}" ${s.error === k ? 'selected' : ''}>${v}</option>`).join('')}
    </select>
    <button onclick="saveOverride()">Guardar decisión del docente</button>`;
  if (!s.error) $('ov').value = '';
}

async function saveOverride() {
  const v = $('ov').value;
  await api('/teacher/override', { student:openName, error: v || null });
  refresh();
}
function closePanel() { openName = null; $('panel').classList.remove('open'); }
window.saveOverride = saveOverride; window.closePanel = closePanel;

$('seed').onclick = async () => { await api('/seed', {}); refresh(); };
$('reset').onclick = async () => { await api('/reset', {}); closePanel(); refresh(); };
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
